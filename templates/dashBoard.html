<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store Dashboard</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/dashboard.css">
</head>

<body class="bg-light">

<div class="container-fluid py-4">

    <!-- Heading -->
    <!-- Top Navbar -->
    <nav class="navbar navbar-expand-lg bg-white rounded shadow-sm mb-4 px-3">

        <!-- Hamburger Menu -->
        <div class="dropdown">

            <button class="btn btn-outline-secondary"
                    type="button"
                    data-bs-toggle="dropdown"
                    aria-expanded="false">

                <i class="bi bi-list fs-4"></i>

            </button>

            <ul class="dropdown-menu shadow">

                <li>
                    <a class="dropdown-item"
                       href="/dashboard/products">

                        <i class="bi bi-box-seam me-2"></i>
                        Manage Products

                    </a>
                    </li>

                    <li>

                        <a class="dropdown-item"
                           href="/dashboard/profile">

                            <i class="bi bi-person-circle me-2"></i>

                            My Profile

                        </a>

                    </li>

                    <li><hr class="dropdown-divider"></li>

                <li>
                    <a class="dropdown-item"
                       href="/">

                        <i class="bi bi-receipt me-2"></i>
                        Billing

                    </a>
                </li>

            </ul>

        </div>


        <!-- Title -->
        <div class="text-center flex-grow-1">

            <h3 class="fw-bold mb-0">
                Dashboard
            </h3>

            <small class="text-muted">
                Store Billing System
            </small>

        </div>

        <!-- Logout -->
        <a href="/logout" class="btn btn-primary">

            <i class="bi bi-box-arrow-right"></i>

            Logout

        </a>

    </nav>

    <!-- Cards -->

    <div class="row g-4">

        <!-- Products -->
        <div class="col-lg-4 col-md-6">

            <div class="card shadow-sm border-0 h-100">

                <div class="card-body d-flex justify-content-between align-items-center">

                    <div>
                        <h6 class="text-muted">Available Products</h6>
                        <h2 class="fw-bold mb-0" id="totalProducts">0</h2>
                    </div>

                    <div class="fs-1 text-primary">
                        <i class="bi bi-box-seam"></i>
                    </div>

                </div>

            </div>

        </div>

        <!-- Stock -->

        <div class="col-lg-4 col-md-6">

            <div class="card shadow-sm border-0 h-100">

                <div class="card-body d-flex justify-content-between align-items-center">

                    <div>
                        <h6 class="text-muted">Available Stock</h6>
                        <h2 class="fw-bold mb-0" id="availableStock">0</h2>
                    </div>

                    <div class="fs-1 text-success">
                        <i class="bi bi-stack"></i>
                    </div>

                </div>

            </div>

        </div>

        <!-- Low Stock -->

        <div class="col-lg-4 col-md-6">

            <div class="card shadow-sm border-0 h-100">

                <div class="card-body d-flex justify-content-between align-items-center">

                    <div>
                        <h6 class="text-muted">Low Stock</h6>
                        <h2 class="fw-bold text-danger mb-0" id="lowStock">0</h2>
                    </div>

                    <div class="fs-1 text-danger">
                        <i class="bi bi-exclamation-triangle"></i>
                    </div>

                </div>

            </div>

        </div>

    </div>

    <!-- Sales Report -->

    <div class="card mt-5 shadow-sm border-0">

        <div class="card-header bg-white">

            <h5 class="mb-0 fw-bold">
                Sales Report
            </h5>

        </div>

        <div class="card-body">

            <div class="row align-items-end g-3">

                <div class="col-md-4">

                    <label class="form-label">From Date</label>

                    <input type="date"
                        class="form-control"
                        id="fromDate">

                </div>

                <div class="col-md-4">

                    <label class="form-label">To Date</label>

                    <input type="date"
                        class="form-control"
                        id="toDate">

                </div>

                <div class="col-md-4">

                    <button
                        class="btn btn-primary w-100"
                        id="generateReport">

                        <i class="bi bi-search"></i>

                        Generate Report

                    </button>

                </div>

            </div>

        </div>

    </div>

    <!-- Charts -->

    <div class="row mt-4 g-4">

        <!-- Sales Chart -->

        <div class="col-lg-8">

            <div class="card shadow-sm border-0">

                <div class="card-header bg-white">

                    <h5 class="fw-bold mb-0">

                        Product Sales

                    </h5>

                </div>

                <div class="card-body">

                    <canvas
                        id="salesChart"
                        height="120">
                    </canvas>

                </div>

            </div>

        </div>

        <!-- Inventory Chart -->

        <div class="col-lg-4">

            <div class="card shadow-sm border-0">

                <div class="card-header bg-white">

                    <h5 class="fw-bold mb-0">

                        Stock Distribution

                    </h5>

                </div>

                <div class="card-body">

                    <canvas
                        id="stockChart">
                    </canvas>

                </div>

            </div>

        </div>

    </div>

    <!-- Low Stock Table -->

    <div class="card mt-4 shadow-sm border-0">

        <div class="card-header bg-white">

            <h5 class="fw-bold mb-0">

                Low Stock Products

            </h5>

        </div>

        <div class="card-body p-0">

            <table class="table table-hover mb-0">

                <thead class="table-light">

                    <tr>

                        <th>Product</th>

                        <th>Category</th>

                        <th>Available Qty</th>

                    </tr>

                </thead>

                <tbody id="lowStockTable">

                    <tr>

                        <td colspan="3"
                            class="text-center text-muted py-4">

                            No Data Available

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

<!-- Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- JS -->
<script src="/static/js/dashboard.js"></script>

</body>

</html>
