<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Profile</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <link rel="stylesheet"
          href="/css/dashboard.css">

</head>

<body class="bg-light">

<div class="container py-5">

    <!-- Top Bar -->

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h2 class="fw-bold mb-0">
                Admin Profile
            </h2>

            <small class="text-muted">
                Store Billing System
            </small>

        </div>

        <a href="/dashboard"
           class="btn btn-outline-primary">

            <i class="bi bi-arrow-left"></i>

            Dashboard

        </a>

    </div>

    <!-- Profile Card -->

    <div class="card border-0 shadow">

        <div class="card-body p-5">

            <!-- Avatar -->

            <div class="text-center mb-4">

                <i class="bi bi-person-circle"
                   style="font-size:90px;color:#0d6efd;"></i>

                <h4 class="mt-3"
                    id="profileTitle">

                    Administrator

                </h4>

            </div>

            <form id="profileForm">

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Admin ID
                        </label>

                        <input
                                type="text"
                                id="adminId"
                                class="form-control"
                                readonly>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Phone Number
                        </label>

                        <input
                                type="text"
                                id="phone"
                                class="form-control">

                    </div>

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Full Name

                    </label>

                    <input
                            type="text"
                            id="name"
                            class="form-control">

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Password

                    </label>

                    <div class="input-group">

                        <input
                                type="password"
                                id="password"
                                class="form-control">

                        <button
                                class="btn btn-outline-secondary"
                                type="button"
                                id="togglePassword">

                            <i class="bi bi-eye"></i>

                        </button>

                    </div>

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Created At

                        </label>

                        <input
                                type="text"
                                id="createdAt"
                                class="form-control"
                                readonly>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Updated At

                        </label>

                        <input
                                type="text"
                                id="updatedAt"
                                class="form-control"
                                readonly>

                    </div>

                </div>

                <div class="text-end mt-4">

                    <button
                            type="button"
                            id="updateProfile"
                            class="btn btn-primary">

                        <i class="bi bi-check-circle"></i>

                        Update Profile

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<script src="/static/js/profile.js"></script>

</body>

</html>
