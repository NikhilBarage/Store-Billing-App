<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Registration</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admincss.css') }}">


</head>


<body>


<div class="container">


    <h2>Admin Registration</h2>


    <form method="POST" action="/reg">


        <input
            type="text"
            name="name"
            placeholder="Enter Admin Name"
            required>


        <input
            type="text"
            name="phone"
            placeholder="Enter Phone Number"
            maxlength="10"
            required>


        <input
            type="password"
            name="password"
            placeholder="Enter Password"
            required>


        <button type="submit">
            Register
        </button>


    </form>


    <a href="/login">
        Already have account? Login
    </a>


</div>


</body>

</html>
